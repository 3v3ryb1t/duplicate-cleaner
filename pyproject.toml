[project]
name = "duplicate-cleaner"
version = "0.1.1"
description = "Cleans specified directories from duplicates based on hash comparison"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Konstantin Kovalenko", email = "konstantin.l.kovalenko@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
[project.urls]
Homepage = "https://github.com/3v3ryb1t/duplicate-cleaner"
Repository = "https://github.com/3v3ryb1t/duplicate-cleaner"


[project.scripts]
duplicate-cleaner = "duplicate_cleaner.duplicate_cleaner:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers = [
    "unit: Isolated tests using mocks or parsing logic without disk I/O",
    "functional: Core logic tests interacting with temporary file trees",
    "integration: Component integration tests invoking the main execution flow"
]

addopts = "-v --tb=short --cov --cov-report=term --cov-report=html --alluredir=allure-results"
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist"
]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = "Cover"
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]

[tool.coverage.html]
directory = "htmlcov" 

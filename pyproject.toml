[project]
name = "duplicate-cleaner"
version = "0.1.0"
description = "Cleans specified directories from duplicates based on hash comparison"
readme = "README.md"
authors = [
    { name = "Konstantin Kovalenko", email = "konstantin.l.kovalenko@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
duplicate-cleaner = "duplicate_cleaner.duplicate_cleaner:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers = [
    "unit: юнит-тесты",
    "integration: интеграционные сценарии"
]

addopts = "-v --tb=short --cov --cov-report=term --cov-report=html --alluredir=allure-results"
norecursedirs = [
    ".git",
    ".venv",
    "build",
    "dist"
]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = "Cover"
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]

[tool.coverage.html]
directory = "htmlcov" 